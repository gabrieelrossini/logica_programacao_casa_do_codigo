<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <script>
        document.write("Minha idade é: " + 31 + "<br>");
        document.write("A soma das nossas idades é: " + (31+32+26));
        document.write("<br>A média das nossas idades é: " + ((31+32+26)/3));
        document.write("<br>Nossa diferença de idade é de " + 10 + " anos");
        document.write("<br>Nós passamos cerca de " + (2026/28) + " gerações desde o ano zero");
    </script>
</body>
</html>
