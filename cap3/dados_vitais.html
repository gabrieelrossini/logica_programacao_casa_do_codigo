<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <script>
        function pulaLinha() {
            document.write("<br>");
        };
        var calculaDiasDeVida = function(idade){
            var dias = idade * 365;
            return dias;
        };
        var calculaBatimentos = function(dias) {
            var batimentos = dias * 24 * 60 * 80; 
            return batimentos;
        };
        var idade = prompt("Quantos anos você tem?");
        var dias = calculaDiasDeVida(idade);
        var batimentos = calculaBatimentos(dias);
        document.write("Você já viveu " + dias + " dias de vida.");
        pulaLinha();
        document.write("Seu coração bateu aproximadamente " + batimentos + " vezes. Haja coração!");
    </script>
</body>
</html>
