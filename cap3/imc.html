<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <script>
        // pular uma linha a cada frase
        function pulaLinha() {
            document.write("<br>");
        };
        // colocar uma frase como variável e aplicar função pulaLinha
        var mostra = function(frase) {
            document.write(frase);
            pulaLinha();
        };
        // calcular o imc e aplicar a função mostra
        var calculaIMC = function(altura, peso) {
            var imc = peso / (altura * altura);
            return imc;
        };
        // aplicação de calculaIMC com variáveis pré existentes
        var nome = prompt("Olá! Qual é o seu nome?")
        var altura = prompt(nome + ", qual a sua altura?");
        var peso = prompt(nome + ", qual o seu peso?")
        var imc = Math.round(calculaIMC(altura, peso));
        mostra(nome + ", seu imc é de " + imc);
        mostra(nome + ", seu imc está " + (imc - 18.5) + " pontos acima da magreza");
        mostra(nome + ", seu imc está " + (35 - imc) + " pontos abaixo da obesidade");
    </script>
</body>
</html>
