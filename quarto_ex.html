<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <script>
        var ano = 2026;
        document.write("Eu nasci em " + (ano - 31) + "<br>");
        document.write("Adriano nasceu em " + (ano - 40) + "<br>");
        document.write("Paulo nasceu em " + (ano - 46) + "<br>");
    </script>
    <script>
        var ano = 2025;
        document.write("Ano passado foi " + ano);
    </script>
    <script>
        var eu = 31;
        var adriano = 40;
        var paulo = 46;
        var total = eu + adriano + paulo;
        document.write("<br>A soma das idades é " + total + "<br>");
        var media = total / 3;
        document.write(media);
        document.write("<br>A média de idade é " + Math.round(media));
    </script>
    <script>
        var ano = 2026;
        document.write("<br>ano ");
        document.write(ano + "<br>");
    </script>
</body>
</html>
