<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
</head>
<body?>
    <script>
        // esta função faz com que pule 2 linhas com um traçado no meio
        function pulaLinha() {
            document.write("<br><hr><br>");
        };

        // esta função mostra uma frase no navegador e ativa a função anterior
        function mostra(frase) {
            document.write(frase);
            pulaLinha();
        };

        // aplicação das funções
        var ano = 2026;
        mostra("<big>Eu nasci em " + (ano - 31) + "</big>");
        mostra("<big>Adriano nasceu em " + (ano - 40) + "</big>");
        mostra("<big>Paulo nasceu em " + (ano - 46) + "</big>");
        console.log("esta mensagem aparece apenas no log");
    </script>
</body>
</html>
