<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <script>
        // pular uma linha a cada frase
        function pulaLinha() {
            document.write("<br>");
        };
        // colocar uma frase como variável e aplicar função pulaLinha
        function mostra(frase) {
            document.write(frase);
            pulaLinha();
        };

        function sorteia(n) {
            var numeroPensado = Math.round(Math.random() * n);
            return numeroPensado;
        }
        var numeroPensado = sorteia(100);

        var chute = prompt("Já pensei. Qual você acha que é?");

        if (isNaN(chute)) {
            mostra("Apenas números são válidos.")
        } else
            if (chute == numeroPensado) {
                mostra("Uau! Você acertou, pois eu pensei no " + numeroPensado);
            } else {
                if (chute < numeroPensado) {
                    mostra("Você errou! Seu número é menor!");
                } else {
                    mostra("Você errou! Seu número é maior!");
                };
            };

    </script>
</body>
</html>
