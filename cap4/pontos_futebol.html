<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <script>
        // pular uma linha a cada frase
        function pulaLinha() {
            document.write("<br>");
        };

        // colocar uma frase como variável e aplicar função pulaLinha
        function mostra(frase) {
            document.write(frase);
            pulaLinha();
        };

        // função calculaPontos recebe o número de vitórias e empates, retornando o total de pontos
        function calculaPontos(vitorias, empates, derrotas) {
            return (vitorias * 3) + empates - derrotas;
        }

        // perguntar para o usuário quantidade de vitórias e empates do time através da função prompt
        var vitorias = parseInt(prompt("Quantos jogos o CDC Futebol Clube venceu?"));
        var empates = parseInt(prompt("Quantos jogos o CDC Futebol Clube empatou?"));
        var derrotas = parseInt(prompt("Quantos jogos o CDC Futebol Clube perdeu?"));

        // calcular a quantidade de pontos, usando parseInt para mudar as variáveis de calculaPontos de string para inteiro
        var pontos = calculaPontos(vitorias,empates, derrotas);

        var vitorias_adversario = parseInt(prompt("Quantos jogos o adversário venceu?"));
        var empates_adversario = parseInt(prompt("Quantos jogos o adversário empatou?"));
        var derrotas_adversario = parseInt(prompt("Quantos jogos o adversário perdeu?"));
        var pontos_adversario = calculaPontos(vitorias_adversario, empates_adversario, derrotas_adversario);

        // aponta na tela quantos pontos o time tem
        mostra("Nosso time tem " + pontos + " pontos!");

        // Considere que o Livros Velhos FC esteja com 28 pontos
        // lógica aplicada para mostrar a colocação referente entre os dois times de acordo com os pontos
        if(pontos > pontos_adversario) {
            mostra("Nosso time está indo MELHOR que o Livros Velhos!");
        }
        
        if(pontos < pontos_adversario) {
            mostra("Nosso time está indo PIOR que o Livros Velhos!");
        }

        if(pontos == pontos_adversario) {
            mostra("Nosso time está EMPATANDO com o Livros Velhos!");
        }
    </script>
</body>
</html>
