<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <script>
        // função para colocar uma frase como variável e aplicar o pulo de linha automaticamente
        function mostra(frase) {
            document.write(frase + "<br>");
        };

        var anoComoTexto = prompt("Informe o ano inicial");
        var anoDeOlimpiada = parseInt(anoComoTexto);

        var anoLimite = prompt("Qual é o ano limite?");

        while(anoDeOlimpiada <= anoLimite) {
            mostra(anoDeOlimpiada + " tem Olimpíada!");
            anoDeOlimpiada= anoDeOlimpiada + 4;
        };

        mostra("Ufa! Esses foram os anos de Olimpíada até " + anoLimite);
    </script>
</body>
</html>
