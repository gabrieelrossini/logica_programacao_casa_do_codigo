<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <script>
        var tamanho = parseInt(prompt("Quantas linhas terá o triângulo?"));

        for(var linha = 0; linha < tamanho; linha++) {
            for(var coluna = 0; coluna <= linha; coluna++) {
                document.write("*");
            }
            document.write("<br>");
        };
    </script>
</body>
</html>
