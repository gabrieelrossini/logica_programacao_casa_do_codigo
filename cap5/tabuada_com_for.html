<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <script>
        // função para colocar uma frase como variável e aplicar o pulo de linha automaticamente
        function mostra(frase) {
            document.write(frase + "<br>");
        };

        // for ([inicialização]; [condição para repetir]; [modificação do valor]), o "multiplicador++" é uma simplificação de "multiplicador = multiplicador + 1"
        for(var multiplicador = 1; multiplicador <= 10; multiplicador++) {
            mostra(multiplicador * 7);
        };

    </script>
</body>
</html>
