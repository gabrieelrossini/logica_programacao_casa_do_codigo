<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <script>
        for(var linha = 0; linha < 10; linha++) {
            for(var coluna = 0; coluna < 10; coluna++) {
                document.write("*");
            }
            document.write("<br>");
        }
    </script>
</body>
</html>
